name: Build Banano Hand Tracking Android Plugin

on:
  push:
    paths:
      - "android/hand_tracking_plugin/**"
      - "addons/banano_hand_tracking/**"
      - ".github/workflows/build-hand-tracking.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download MediaPipe model
        shell: bash
        run: |
          mkdir -p android/hand_tracking_plugin/handtracking/src/main/assets
          curl -L --fail --retry 3 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o android/hand_tracking_plugin/handtracking/src/main/assets/hand_landmarker.task

      - name: Build release AAR
        run: gradle -p android/hand_tracking_plugin :handtracking:assembleRelease --no-daemon

      - name: Build debug AAR
        run: gradle -p android/hand_tracking_plugin :handtracking:assembleDebug --no-daemon

      - name: Copy AARs into Godot addon
        shell: bash
        run: |
          mkdir -p addons/banano_hand_tracking
          cp android/hand_tracking_plugin/handtracking/build/outputs/aar/handtracking-release.aar addons/banano_hand_tracking/BananoHandTracking-release.aar
          cp android/hand_tracking_plugin/handtracking/build/outputs/aar/handtracking-debug.aar addons/banano_hand_tracking/BananoHandTracking-debug.aar

      - name: Commit generated plugin binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/banano_hand_tracking/*.aar
          if git diff --cached --quiet; then echo "AAR files are already current."; exit 0; fi
          git commit -m "build: package Banano hand tracking AARs"
          git push